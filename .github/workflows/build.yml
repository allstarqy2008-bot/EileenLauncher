name: Build Eileen APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/eileen/launcher
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EileenLauncher"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.eileen.launcher'
              compileSdk 35
              defaultConfig {
                  applicationId "com.eileen.launcher"
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName "1.1"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="艾琳">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/eileen/launcher/MainActivity.java <<'EOF'
          package com.eileen.launcher;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      Intent i = new Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("https://chat.com/?mode=voice")
                      );
                      i.setPackage("com.openai.chatgpt");
                      startActivity(i);
                  } catch (ActivityNotFoundException e) {
                      Toast.makeText(
                          this,
                          "无法启动 ChatGPT Voice",
                          Toast.LENGTH_LONG
                      ).show();
                  }
                  finish();
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      -
